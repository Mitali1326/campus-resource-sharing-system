# k8s/campus.yaml
# The same 8 containers as docker-compose.yml, but run by Kubernetes.
#  - each department is a Deployment (keeps the wanted number of Pods alive)
#  - each Deployment has a Service (stable DNS name such as "comp-node")
#  - the gateway Service is a NodePort so a browser can reach it
# Build the image first (see README, Part E):  docker build -t campus-ds:latest .
apiVersion: v1
kind: Namespace
metadata:
  name: campus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comp-node
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comp-node
  template:
    metadata:
      labels:
        app: comp-node
    spec:
      containers:
        - name: comp-node
          image: campus-ds:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "server/nodes/compNode.js"]
          ports:
            - containerPort: 5001
          env:
            - name: GATEWAY_URL
              value: "http://gateway:5000"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: comp-node
  namespace: campus
spec:
  type: ClusterIP
  selector:
    app: comp-node
  ports:
    - port: 5001
      targetPort: 5001
---
